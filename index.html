<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My English Adventure – Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#1f2937;--c:#3b82f6}
html,body{margin:0;min-height:100%;background:#fffbeb;color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:14px}
button{font-family:inherit}
header{display:flex;align-items:center;gap:10px;background:var(--c);color:#fff;border-radius:22px;padding:10px 14px;margin-bottom:16px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
header h1{font-size:19px;margin:0;flex:1;line-height:1.15}
header .back{background:#fff;color:var(--c);border:0;border-radius:14px;font-weight:700;padding:8px 12px;cursor:pointer;font-size:15px}
.wallet{background:#fff;color:var(--ink);border:0;border-radius:16px;padding:5px 10px;font-weight:700;cursor:pointer;text-align:center;min-width:86px}
.wallet b{color:var(--c)}
.wallet .bar{height:7px;background:#e5e7eb;border-radius:5px;margin-top:3px;overflow:hidden}
.wallet .bar i{display:block;height:100%;background:#facc15;width:0}
.gift{background:#fde047;border:0;border-radius:14px;font-size:22px;padding:4px 9px;cursor:pointer;animation:wob 1s infinite}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.unit{border:0;border-radius:20px;color:#fff;font-weight:700;padding:14px 8px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);text-align:center}
.unit:active,.mode:active,.big-btn:active{transform:translateY(3px)}
.unit .n{font-size:28px;display:block}.unit .t{font-size:15px;display:block;min-height:36px}
.unit .p{display:flex;justify-content:center;gap:2px;margin-top:4px}.unit .p svg{width:34px;height:34px}
.topic{background:#fff;border:3px solid var(--c);border-radius:22px;padding:12px;margin-bottom:14px}
.topic h2{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:8px;color:var(--c)}
.topic h2 svg{width:36px;height:36px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:0;border-radius:16px;background:var(--c);color:#fff;font-weight:700;font-size:15px;padding:12px 8px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);text-align:center;line-height:1.2}
.mode .i{font-size:26px;display:block}.mode small{display:block;font-weight:400;font-size:12px;margin-top:2px}.mode .m{display:block;font-size:12px;margin-top:2px;color:#fde047}
.pic{display:inline-flex;align-items:center;justify-content:center;gap:2px}
.pic svg{width:64px;height:64px}.em{font-size:56px;line-height:1}
.dot{width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.num{font-size:46px;font-weight:800}
.tile{min-width:78px;padding:12px 8px;border-radius:14px;color:#fff;font-weight:800;font-size:22px;text-align:center;border:3px solid rgba(0,0,0,.15)}
.row2 svg{width:50px;height:50px}.pic.multi svg{width:44px;height:44px}
.big .pic svg{width:128px;height:128px}.big .em{font-size:96px}.big .dot{width:104px;height:104px}.big .num{font-size:84px}.big .tile{font-size:34px;min-width:150px}.big .pic.multi svg{width:76px;height:76px}.big .row2 svg{width:84px;height:84px}
.stage{background:#fff;border:3px solid var(--c);border-radius:24px;padding:14px;text-align:center}
.prog{height:12px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.q{font-size:20px;font-weight:700;margin:6px 0 12px;line-height:1.25}
.say{border:0;background:var(--c);color:#fff;border-radius:50%;width:88px;height:88px;font-size:40px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);margin:4px 6px 12px}
.say.slow{width:60px;height:60px;font-size:26px;background:#94a3b8}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice .tile{font-size:17px;min-width:0;width:100%}
.choice{background:#fff;border:3px solid #d1d5db;border-radius:20px;min-height:100px;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:2px;line-height:1.2}
.choice .ow{font-size:15px}
.choice.good{background:#dcfce7;border-color:#22c55e;animation:pop .4s}
.choice.bad{background:#fee2e2;border-color:#ef4444;animation:shake .35s}
.choice.mini{min-height:80px;font-size:13px}.choice.mini svg{width:38px;height:38px}.choice.mini .em{font-size:32px}.choice.mini .dot{width:34px;height:34px}.choice.mini .num{font-size:26px}.choice.mini .tile{font-size:13px;min-width:0;padding:6px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:1/1;border:0;border-radius:16px;background:var(--c);color:#fff;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18);padding:2px;font-weight:700}
.card.up{background:#fff;color:var(--ink);border:3px solid var(--c);font-size:14px;line-height:1.1}
.card.up svg{width:50px;height:50px}.card.up .em{font-size:34px}.card.up .dot{width:36px;height:36px}.card.up .num{font-size:26px}.card.up .tile{min-width:0;font-size:12px;padding:6px 4px}.card.up .pic.multi svg{width:24px;height:24px}
.card.done{background:#dcfce7;border:3px solid #22c55e}
.placed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;margin-bottom:12px;padding:8px;border:3px dashed var(--c);border-radius:16px}
.chip{background:#dcfce7;border:2px solid #22c55e;border-radius:12px;padding:4px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.chip b{background:#22c55e;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.chip svg{width:26px;height:26px}
.balloons{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:30px;margin:6px 0 14px;line-height:1.1}
.big-btn{border:0;border-radius:20px;background:#22c55e;color:#fff;font-weight:800;font-size:22px;padding:16px 26px;margin:10px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.end{text-align:center;padding:10px 0}
.end .stars{font-size:44px;letter-spacing:4px;margin:6px 0}
.end button{border:0;border-radius:18px;background:var(--c);color:#fff;font-weight:700;font-size:18px;padding:14px 20px;margin:6px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.end button.alt{background:#fff;color:var(--c);border:3px solid var(--c)}
.starry{width:90px;height:90px;display:block;margin:0 auto;animation:float 2.2s ease-in-out infinite}
.tree{width:100%;height:auto;display:block}
.tree text{font-family:inherit;font-weight:700;font-size:13px;fill:#1f2937}
.per{cursor:pointer}.per .bob{transform-box:fill-box;transform-origin:50% 100%}
.per.wig .bob{animation:wiggle .7s}
.per.bad .bob{animation:shake .35s}
.bubble{min-height:58px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fef9c3;border:3px solid #facc15;border-radius:18px;font-weight:700;font-size:18px;padding:8px 12px;margin-bottom:10px}
.bubble svg{width:44px;height:44px}
.albumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stk{aspect-ratio:1/1;border-radius:16px;border:3px solid #d1d5db;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;cursor:pointer}
.stk small{font-size:11px;font-weight:700;margin-top:2px}.stk.lock{opacity:.45;font-size:30px;cursor:default}
.overlay{position:fixed;inset:0;background:rgba(31,41,55,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{background:#fff;border-radius:28px;padding:24px;text-align:center;max-width:340px;width:100%;border:5px solid #facc15}
.modal .box{font-size:96px;display:inline-block}.modal .box.shake{animation:shake .5s infinite}
.modal .reveal{font-size:110px;animation:pop .6s}
.modal h3{margin:6px 0 4px;font-size:24px}
footer{text-align:center;font-size:12px;color:#6b7280;margin:18px 0 6px}
.burst{position:fixed;pointer-events:none;font-size:26px;animation:fly 1s ease-out forwards;z-index:30}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) scale(1.1)}40%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(-8deg) scale(1.1)}80%{transform:rotate(6deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

      st.appendChild(s);st.appendChild(sl);setTimeout(function(){say(q.say)},250)}
    else{if(q.pic)st.appendChild($('<div class="big" style="margin-bottom:8px">'+q.pic+'</div>'));
      st.appendChild($('<div class="q">'+q.q+'</div>'));if(q.q&&q.q.indexOf('___')<0)setTimeout(function(){say(q.q)},250)}
    q.opts.forEach(function(o){var b=$('<button class="choice">'+(q.listen&&!q.textOpt?pic(o):opt(o))+'</button>');
      b.onclick=function(ev){
        if(o===q.ans){b.classList.add('good');beep([660,880]);var sp=q.listen?q.ans.w:txt(q.ans);say(q.q&&q.q.indexOf('___')>=0?q.q.replace('___',sp):sp);
          earned++;if(!tried)firstTry++;addStar(1,ev);Array.prototype.forEach.call(ch.children,function(x){x.disabled=true});setTimeout(function(){r++;round()},1500)}
        else{tried=true;b.classList.add('bad');b.disabled=true;beep([200])}};ch.appendChild(b)});
    st.appendChild(ch);app.appendChild(st)}
  round()}
function quizItems(ui,ti,m,t){
  var items=shuffle(t.items).slice(0,8),rounds=items.map(function(it){
    var o=shuffle([it].concat(shuffle(t.items.filter(function(x){return x!==it})).slice(0,3)));
    if(m==='listen')return {listen:1,say:(t.sayPrefix||'')+it.w,opts:o,ans:it,textOpt:t.textOptions};
    return {pic:pic(it),q:'What is this?',opts:o.map(function(x){return x.w}),ans:it.w}});
  runQuiz(ui,ti,m,t,rounds)}
function quizQ(ui,ti,m,t){
  var rounds=shuffle(t.quiz).slice(0,8).map(function(q){
    var op=shuffle([q.a].concat(q.o.length>3?shuffle(q.o).slice(0,3):q.o));
    return {pic:q.i||q.e?pic(q):'',q:q.q,opts:op,ans:q.a}});
  runQuiz(ui,ti,m,t,rounds)}
function memory(ui,ti,m,t){
  var set=shuffle(t.items).slice(0,6),cards=[];set.forEach(function(it){cards.push({it:it,k:'p'});cards.push({it:it,k:'w'})});
  cards=shuffle(cards);var open=[],found=0,lock=false,moves=0;shell(ui,ti,m,t);
  var st=$('<div class="stage"><div class="q">Find a picture and its word!</div><div class="mem"></div></div>'),g=st.lastChild;
  cards.forEach(function(cd){var b=$('<button class="card" aria-label="card">?</button>');
    b.onclick=function(ev){
      if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
      b.classList.add('up');b.innerHTML=cd.k==='p'?pic(cd.it):cd.it.w;say(cd.it.w);open.push([b,cd]);
      if(open.length===2){moves++;lock=true;var a=open[0],c=open[1];
        if(a[1].it===c[1].it){setTimeout(function(){a[0].className=c[0].className='card up done';found++;beep([660,880]);addStar(1,ev);open=[];lock=false;
          if(found===set.length)setTimeout(function(){finish(ui,ti,m,t,set.length,moves<=set.length+2?1:moves<=set.length*2?.7:.4)},900)},500)}
        else{beep([200]);setTimeout(function(){[a,c].forEach(function(x){x[0].className='card';x[0].textContent='?'});open=[];lock=false},1000)}}};
    g.appendChild(b)});
  app.appendChild(st)}
function order(ui,ti,m,t){
  var seq=t.items,idx=0,mistakes=0,earned=0,bad={};shell(ui,ti,m,t);
  var st=$('<div class="stage"><div class="q">Tap them in the right order!</div><div class="placed" id="placed"><span style="color:#9ca3af">1, 2, 3...</span></div><div class="choices" style="grid-template-columns:repeat(2,minmax(0,1fr))"></div></div>'),ch=st.lastChild,pl=st.querySelector('#placed');
  shuffle(seq).forEach(function(it){var b=$('<button class="choice">'+(it.ab?'<span class="tile" style="background:'+it.col+'">'+it.w+'</span>':pic(it)+'<span class="ow">'+it.w+'</span>')+'</button>');
    b.onclick=function(ev){
      if(it===seq[idx]){b.disabled=true;b.style.opacity=.35;beep([660,880]);say(it.w);if(idx===0)pl.innerHTML='';
        pl.appendChild($('<span class="chip"><b>'+(idx+1)+'</b>'+(it.ab?'':svg(it.i||'clock'))+it.w+'</span>'));
        if(!bad[it.w]){earned++;addStar(1,ev)}idx++;
        if(idx===seq.length)setTimeout(function(){finish(ui,ti,m,t,earned,1-mistakes/(seq.length*1.5))},900)}
      else{mistakes++;bad[seq[idx].w]=1;b.classList.add('bad');beep([200]);setTimeout(function(){b.classList.remove('bad')},400)}};
    ch.appendChild(b)});
  app.appendChild(st)}
function count(ui,ti,m,t){
  var rounds=shuffle(t.items).slice(0,6).map(function(it){var ob='';for(var k=0;k<it.v;k++)ob+='<span>'+['🎈','⭐','🍎','🐥'][Math.floor(Math.random()*4)]+'</span>';
    var o=shuffle([it].concat(shuffle(t.items.filter(function(x){return x!==it})).slice(0,3))).map(function(x){return x.w});
    return {pic:'<div class="balloons">'+ob+'</div>',q:'How many?',opts:o,ans:it.w}});
  runQuiz(ui,ti,m,t,rounds)}
function move(ui,ti,m,t){
  var acts=shuffle(t.items).slice(0,6),r=0,earned=0;
  function round(){
    if(r>=acts.length)return finish(ui,ti,m,t,earned,1);
    var it=acts[r];shell(ui,ti,m,t);
    var st=$('<div class="stage"><div class="prog"><i style="width:'+(r/acts.length*100)+'%"></i></div><div class="q">Starry says...</div><div class="big">'+pic(it)+'</div><div class="q" style="font-size:30px">'+it.w+'!</div></div>');
    var s=$('<button class="say" aria-label="Hear it">🔊</button>');s.onclick=function(){say('Starry says: '+it.w)};st.appendChild(s);
    var d=$('<button class="big-btn">✔ I did it!</button>');
    d.onclick=function(ev){beep([660,880]);var ch=t.cheers[Math.floor(Math.random()*t.cheers.length)];say(ch);earned++;addStar(1,ev);d.disabled=true;d.textContent=ch;setTimeout(function(){r++;round()},1700)};
    st.appendChild(d);app.appendChild(st);setTimeout(function(){say('Starry says: '+it.w)},250)}
  round()}
// ---- family tree ----
var TREE=[['grandmother',70,6],['grandfather',200,6],['mother',20,130],['father',110,130],['aunt',215,130],['uncle',305,130],['me',20,262],['brother',100,262],['sister',180,262],['cousin',265,262]];
function treeSVG(){
  var p='<svg class="tree" viewBox="0 0 396 372" role="img" aria-label="Family tree"><g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"><path d="M175 78 V104 M100 104 H285 M100 104 V150 M285 104 V150"/><path d="M80 214 V236 M55 236 H215 M55 236 V262 M135 236 V262 M215 236 V262 M290 214 V262"/></g>'+
   '<text x="188" y="48" text-anchor="middle" style="font-size:26px">❤</text><text x="95" y="178" text-anchor="middle" style="font-size:20px">❤</text><text x="280" y="178" text-anchor="middle" style="font-size:20px">❤</text>';
  TREE.forEach(function(P){var k=P[0],x=P[1],y=P[2];
    var ic=k==='me'?'<polygon points="50,6 62,36 94,38 69,58 78,90 50,72 22,90 31,58 6,38 38,36" fill="#facc15" stroke="#d99a00" stroke-width="3" stroke-linejoin="round" transform="translate(0 6)"/><circle cx="41" cy="52" r="3.6"/><circle cx="59" cy="52" r="3.6"/><path d="M41 62 Q50 71 59 62" stroke="#1f2937" stroke-width="3" fill="none"/>':'<g transform="translate(0 0)">'+(ICONS[k]||'')+'</g>';
    var sc=k==='me'?.95:(k==='cousin'||k==='brother'||k==='sister'?.9:.95);
    p+='<g transform="translate('+x+' '+y+')" class="per" data-k="'+k+'"><rect width="76" height="104" rx="12" fill="rgba(255,255,255,.01)"/><g class="bob"><g transform="translate(0 2) scale(.76)">'+ic+'</g><text x="38" y="94" text-anchor="middle">'+(k==='me'?'me!':k)+'</text></g></g>'});
  return p+'</svg>'}
function tree(ui,ti,m,t){
  shell(ui,ti,m,t);var st=$('<div class="stage"><div class="bubble" id="bub">Tap a person and say hello! 👋</div></div>');st.appendChild($(treeSVG()));app.appendChild(st);
  var said={};st.querySelectorAll('.per').forEach(function(g){g.onclick=function(ev){var k=g.getAttribute('data-k'),msg=k==='me'?'Hi! This is me!':'Hello! I am your '+k+'!';
    g.classList.remove('wig');void g.getBBox();g.classList.add('wig');beep([660,880]);say(msg);
    document.getElementById('bub').innerHTML=(k==='me'?STARRY.replace('class="starry"','style="width:44px;height:44px"'):svg(k))+'<span>'+msg+'</span>';
    if(!said[k]){said[k]=1;addStar(1,ev)}}})}
function treefind(ui,ti,m,t){
  var who=shuffle(TREE.map(function(p){return p[0]}).filter(function(k){return k!=='me'})).slice(0,8),r=0,firstTry=0;
  function round(){
    if(r>=who.length)return finish(ui,ti,m,t,firstTry,firstTry/who.length);
    var k=who[r],tried=false;shell(ui,ti,m,t);
    var st=$('<div class="stage"><div class="prog"><i style="width:'+(r/who.length*100)+'%"></i></div><div class="q">Tap the <b>'+k+'</b>!</div></div>');
    var s=$('<button class="say" aria-label="Hear it">🔊</button>');s.onclick=function(){say('Tap the '+k)};st.appendChild(s);st.appendChild($(treeSVG()));app.appendChild(st);setTimeout(function(){say('Tap the '+k)},250);
    st.querySelectorAll('.per').forEach(function(g){g.onclick=function(ev){var c=g.getAttribute('data-k');
      if(c===k){g.classList.add('wig');beep([660,880]);say('Hello! I am your '+k+'!');if(!tried)firstTry++;addStar(1,ev);st.querySelectorAll('.per').forEach(function(x){x.onclick=null});setTimeout(function(){r++;round()},1600)}
      else{tried=true;g.classList.remove('bad');void g.getBBox();g.classList.add('bad');beep([200])}}})}
  round()}
function route(){
  var h=location.hash,m=/^#u(\d+)$/.exec(h);
  if(h==='#album')album();else if(m&&UNITS[+m[1]-1])unitMenu(+m[1]-1);else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
