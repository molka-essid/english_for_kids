<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My English Adventure – Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#1f2937;--c:#3b82f6}
html,body{margin:0;min-height:100%;background:#fffbeb;color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:12px;background:var(--c);color:#fff;border-radius:22px;padding:12px 16px;margin-bottom:16px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
header h1{font-size:22px;margin:0;flex:1}
header button{background:#fff;color:var(--c);border:0;border-radius:14px;font:inherit;font-weight:700;padding:8px 12px;cursor:pointer}
.badge{background:#fff;color:var(--c);border-radius:14px;padding:6px 12px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.unit,.mode{border:0;border-radius:20px;color:#fff;font:inherit;font-weight:700;padding:16px 10px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);text-align:center;transition:transform .08s}
.unit:active,.mode:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.unit .n{font-size:30px;display:block}.unit .t{font-size:15px}
.unit .p{font-size:26px;display:block;margin-top:4px;letter-spacing:4px}
.mode{display:flex;align-items:center;gap:14px;font-size:20px;text-align:left;width:100%;margin-bottom:14px;padding:18px}
.mode span.i{font-size:34px}
.mode small{display:block;font-weight:400;font-size:14px;opacity:.95}
h2{margin:6px 0 12px;font-size:20px}
.pic{display:flex;align-items:center;justify-content:center}
.em{font-size:56px;line-height:1}.dot{width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.num{font-size:46px;font-weight:800}
.big .em{font-size:96px}.big .dot{width:104px;height:104px}.big .num{font-size:84px}
.stage{background:#fff;border:3px solid var(--c);border-radius:24px;padding:14px;text-align:center}
.prog{height:12px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.q{font-size:20px;font-weight:700;margin:6px 0 12px}
.say{border:0;background:var(--c);color:#fff;border-radius:50%;width:92px;height:92px;font-size:42px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);margin:6px auto 14px;display:block}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{background:#fff;border:3px solid #d1d5db;border-radius:20px;min-height:104px;font:inherit;font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:8px}
.mini{flex-direction:column;min-height:84px;font-size:13px;gap:2px}.mini .em{font-size:34px}.mini .dot{width:36px;height:36px}.mini .num{font-size:28px}
.choice.good{background:#dcfce7;border-color:#22c55e;animation:pop .4s}
.choice.bad{background:#fee2e2;border-color:#ef4444;animation:shake .35s}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:1/1;border:0;border-radius:16px;background:var(--c);color:#fff;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18);padding:2px;font-family:inherit;font-weight:700}
.card.up{background:#fff;color:var(--ink);border:3px solid var(--c);font-size:15px}
.card.up .em{font-size:36px}.card.up .dot{width:38px;height:38px}.card.up .num{font-size:28px}
.card.done{background:#dcfce7;border:3px solid #22c55e}
.end{text-align:center;padding:10px 0}
.end .stars{font-size:44px;letter-spacing:4px;margin:6px 0}
.end button{border:0;border-radius:18px;background:var(--c);color:#fff;font:inherit;font-weight:700;font-size:18px;padding:14px 20px;margin:6px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.end button.alt{background:#fff;color:var(--c);border:3px solid var(--c)}
.starry{width:90px;height:90px;display:block;margin:0 auto;animation:float 2.2s ease-in-out infinite}
footer{text-align:center;font-size:12px;color:#6b7280;margin:18px 0 6px}
.burst{position:fixed;pointer-events:none;font-size:26px;animation:fly 1s ease-out forwards;z-index:9}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// ---------------------------------------------------------------
// WORD DATA  (add or change words here; picture = emoji, color or number)
// ---------------------------------------------------------------
var UNITS = [
 {t:'Hello & Colors', c:'#3b82f6', items:[
  {w:'red',col:'#ef4444'},{w:'orange',col:'#fb923c'},{w:'yellow',col:'#facc15'},{w:'green',col:'#22c55e'},
  {w:'blue',col:'#3b82f6'},{w:'pink',col:'#ec4899'},{w:'black',col:'#1f2937'},{w:'white',col:'#ffffff'}]},
 {t:'Numbers & Feelings', c:'#8b5cf6', items:[
  {w:'twelve',n:'12'},{w:'fifteen',n:'15'},{w:'seventeen',n:'17'},{w:'twenty',n:'20'},
  {w:'happy',e:'😀'},{w:'sad',e:'😢'},{w:'tired',e:'😴'},{w:'angry',e:'😠'},{w:'worried',e:'😟'}]},
 {t:'My School Bag', c:'#ef4444', items:[
  {w:'book',e:'📖'},{w:'pencil',e:'✏️'},{w:'pen',e:'🖊️'},{w:'ruler',e:'📏'},
  {w:'scissors',e:'✂️'},{w:'crayons',e:'🖍️'},{w:'calculator',e:'🧮'},{w:'school bag',e:'🎒'}]},
 {t:'Cats, Dogs & Actions', c:'#ec4899', items:[
  {w:'cat',e:'🐱'},{w:'dog',e:'🐶'},{w:'run',e:'🏃'},{w:'jump',e:'🤸'},
  {w:'clap',e:'👏'},{w:'ride a bike',e:'🚴'},{w:'fly',e:'🕊️'}]},
 {t:'Places', c:'#14b8a6', items:[
  {w:'school',e:'🏫'},{w:'restaurant',e:'🍽️'},{w:'hospital',e:'🏥'},
  {w:'park',e:'🌳'},{w:'bus station',e:'🚏'},{w:'shop',e:'🏪'}]},
 {t:'Home & My Day', c:'#f59e0b', items:[
  {w:'bedroom',e:'🛏️'},{w:'kitchen',e:'🍳'},{w:'bathroom',e:'🛁'},{w:'living room',e:'🛋️'},
  {w:'wake up',e:'⏰'},{w:'eat breakfast',e:'🥞'},{w:'play',e:'⚽'},{w:'sleep',e:'🌙'}]},
 {t:'Days & Transport', c:'#22c55e', items:[
  {w:'bus',e:'🚌'},{w:'car',e:'🚗'},{w:'train',e:'🚆'},{w:'airplane',e:'✈️'},
  {w:'truck',e:'🚚'},{w:'helicopter',e:'🚁'},{w:'bike',e:'🚲'},{w:'walk',e:'🚶'}]},
 {t:'My Family', c:'#f43f5e', items:[
  {w:'grandmother',e:'👵'},{w:'grandfather',e:'👴'},{w:'mother',e:'👩'},
  {w:'father',e:'👨'},{w:'brother',e:'👦'},{w:'sister',e:'👧'}]}
];
// ---------------------------------------------------------------
var app = document.getElementById('app');
var total = 0;
function $(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pic(it){
  if(it.col) return '<span class="pic"><span class="dot" style="background:'+it.col+'"></span></span>';
  if(it.n) return '<span class="pic"><span class="num">'+it.n+'</span></span>';
  return '<span class="pic"><span class="em">'+it.e+'</span></span>';
}
function setColor(c){document.documentElement.style.setProperty('--c',c)}
// ---- sound ----
var AC=null;
function beep(freqs){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;
 freqs.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
 g.gain.setValueAtTime(.18,t+i*.13);g.gain.exponentialRampToValueAtTime(.001,t+i*.13+.25);o.connect(g);g.connect(AC.destination);o.start(t+i*.13);o.stop(t+i*.13+.26)})}catch(e){}}
function say(t){try{var s=window.speechSynthesis;s.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.pitch=1.1;s.speak(u)}catch(e){}}
function burst(x,y){for(var i=0;i<12;i++){var s=document.createElement('span');s.className='burst';s.textContent='⭐';
 s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',(Math.random()*240-120)+'px');s.style.setProperty('--y',(Math.random()*-200-20)+'px');
 document.body.appendChild(s);setTimeout(function(e){e.remove()}.bind(null,s),1000)}}
var STARRY='<svg class="starry" viewBox="0 0 100 100"><polygon points="50,6 62,36 94,38 69,58 78,90 50,72 22,90 31,58 6,38 38,36" fill="#facc15" stroke="#d99a00" stroke-width="3" stroke-linejoin="round"/><circle cx="41" cy="50" r="3.6" fill="#1f2937"/><circle cx="59" cy="50" r="3.6" fill="#1f2937"/><path d="M41 60 Q50 69 59 60" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
// ---- header ----
function header(title,back){
  var h=$('<header><h1>'+title+'</h1><span class="badge">⭐ <b id="tot">'+total+'</b></span></header>');
  if(back){var b=document.createElement('button');b.textContent='← Back';b.onclick=back;h.insertBefore(b,h.firstChild)}
  return h;
}
function addStar(n,ev){total+=n;var e=document.getElementById('tot');if(e)e.textContent=total;
 if(ev&&ev.clientX!==undefined)burst(ev.clientX,ev.clientY)}
// ---- screens ----
function home(){
  setColor('#3b82f6');app.innerHTML='';
  app.appendChild(header('My English Games'));
  app.appendChild($('<div style="text-align:center;margin-bottom:10px">'+STARRY+'<h2>Pick your unit and play with Starry!</h2></div>'));
  var g=$('<div class="grid"></div>');
  UNITS.forEach(function(u,i){
    var b=$('<button class="unit" style="background:'+u.c+'"><span class="n">'+(i+1)+'</span><span class="t">'+u.t+'</span><span class="p">'+u.items.slice(0,3).map(function(x){return x.e||(x.col?'●':x.n)}).join(' ')+'</span></button>');
    b.onclick=function(){location.hash='u'+(i+1)};g.appendChild(b)});
  app.appendChild(g);
  app.appendChild($('<footer>No ads • No sign-up • No tracking • Made with ♥ for little learners</footer>'));
}
function unitMenu(i){
  var u=UNITS[i];setColor(u.c);app.innerHTML='';
  app.appendChild(header('Unit '+(i+1)+': '+u.t,function(){location.hash=''}));
  var modes=[['listen','👂','Listen & Tap','Hear the word, tap the picture'],
             ['read','👀','Look & Choose','See the picture, choose the word'],
             ['memory','🃏','Memory Match','Find the pairs']];
  modes.forEach(function(m){
    var b=$('<button class="mode" style="background:'+u.c+'"><span class="i">'+m[1]+'</span><span>'+m[2]+'<small>'+m[3]+'</small></span></button>');
    b.onclick=function(){play(i,m[0])};app.appendChild(b)});
  var w=$('<div class="stage"><div class="q">Words in this unit</div><div class="choices" style="grid-template-columns:repeat(4,1fr)"></div></div>');
  u.items.forEach(function(it){
    var c=$('<button class="choice mini">'+pic(it)+'<span>'+it.w+'</span></button>');
    c.onclick=function(){say(it.w)};w.lastChild.appendChild(c)});
  app.appendChild(w);
  app.appendChild($('<footer>Tap a word to hear it.</footer>'));
}
function play(i,mode){
  if(mode==='memory')return memory(i);
  var u=UNITS[i],items=shuffle(u.items).slice(0,8),r=0,score=0;
  function round(){
    if(r>=items.length)return end(i,mode,score,items.length);
    var it=items[r],tried=false;
    var opts=shuffle([it].concat(shuffle(u.items.filter(function(x){return x!==it})).slice(0,3)));
    app.innerHTML='';app.appendChild(header(u.t,function(){location.hash='u'+(i+1)}));
    var st=$('<div class="stage"><div class="prog"><i style="width:'+(r/items.length*100)+'%"></i></div></div>');
    var ch=$('<div class="choices"></div>');
    if(mode==='listen'){
      st.appendChild($('<div class="q">Listen and tap the right picture!</div>'));
      var s=$('<button class="say" aria-label="Hear the word">🔊</button>');s.onclick=function(){say(it.w)};st.appendChild(s);
      setTimeout(function(){say(it.w)},250);
    }else{
      st.appendChild($('<div class="q">What is this?</div>'));
      st.appendChild($('<div class="big" style="margin-bottom:12px">'+pic(it)+'</div>'));
    }
    opts.forEach(function(o){
      var b=$('<button class="choice">'+(mode==='listen'?pic(o):o.w)+'</button>');
      b.onclick=function(ev){
        if(o===it){b.classList.add('good');beep([660,880]);say(it.w);if(!tried){score++;addStar(1,ev)}
          Array.prototype.forEach.call(ch.children,function(x){x.disabled=true});
          setTimeout(function(){r++;round()},1100)}
        else{tried=true;b.classList.add('bad');b.disabled=true;beep([200])}};
      ch.appendChild(b)});
    st.appendChild(ch);app.appendChild(st);
  }
  round();
}
function memory(i){
  var u=UNITS[i],set=shuffle(u.items).slice(0,6),cards=[];
  set.forEach(function(it){cards.push({it:it,k:'p'});cards.push({it:it,k:'w'})});
  cards=shuffle(cards);var open=[],found=0,lock=false,moves=0;
  app.innerHTML='';app.appendChild(header(u.t,function(){location.hash='u'+(i+1)}));
  var st=$('<div class="stage"><div class="q">Find a picture and its word!</div><div class="mem"></div></div>');
  var g=st.lastChild;
  cards.forEach(function(cd){
    var b=$('<button class="card" aria-label="card">?</button>');
    b.onclick=function(ev){
      if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
      b.classList.add('up');b.innerHTML=cd.k==='p'?pic(cd.it):cd.it.w;
      if(cd.k==='w')say(cd.it.w);
      open.push([b,cd]);
      if(open.length===2){moves++;lock=true;
        var a=open[0],c=open[1];
        if(a[1].it===c[1].it){
          setTimeout(function(){a[0].className=c[0].className='card up done';found++;beep([660,880]);addStar(1,ev);open=[];lock=false;
            if(found===set.length)setTimeout(function(){end(i,'memory',Math.max(1,Math.min(set.length,set.length*2-moves+set.length)),set.length)},700)},400)}
        else{beep([200]);setTimeout(function(){[a,c].forEach(function(x){x[0].className='card';x[0].textContent='?'});open=[];lock=false},900)}}};
    g.appendChild(b)});
  app.appendChild(st);
}
function end(i,mode,score,max){
  var u=UNITS[i];app.innerHTML='';app.appendChild(header(u.t,function(){location.hash='u'+(i+1)}));
  var pct=score/max,stars=pct>.85?3:pct>.5?2:1;
  var e=$('<div class="stage end">'+STARRY+'<h2>'+(stars===3?'Super star!':stars===2?'Great job!':'Good try! Play again!')+'</h2><div class="stars">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+'</div></div>');
  var a=$('<button>Play again</button>');a.onclick=function(){play(i,mode)};
  var b=$('<button class="alt">Other games</button>');b.onclick=function(){location.hash='u'+(i+1)};
  e.appendChild(a);e.appendChild(b);app.appendChild(e);say(stars===3?'Super star!':'Great job!');
  burst(innerWidth/2,innerHeight/2);
}
function route(){
  var m=/^#u(\d+)$/.exec(location.hash);
  if(m&&UNITS[+m[1]-1])unitMenu(+m[1]-1);else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
